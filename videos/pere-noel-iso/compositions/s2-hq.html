<!doctype html>

    <template>
      <style>

          top: 96px;

          bottom: 96px;

        }

          text-align: right;

        }

          <div class="ov-kicker" id="s2-kicker"><span class="rule"></span><span>Siège social · 90°00′ N</span></div>

      <script>
        (function () {
          const S = 7.4;
          const at = (g) => g - S;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s2-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, at(7.85));
          tl.fromTo("#s2-kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6 }, at(7.9));
          tl.fromTo("#s2-title-in", { yPercent: 115 }, { yPercent: 0, duration: 0.85, ease: "power4.out" }, at(8.0));
          tl.fromTo("#s2-activity", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(8.7));
          tl.fromTo("#s2-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, at(9.55));
          tl.fromTo("#s2-old", { opacity: 1 }, { opacity: 0.45, duration: 0.3 }, at(9.9));
          tl.fromTo("#s2-new", { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.4)" }, at(10.6));
          tl.fromTo("#s2-statement", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at(10.55));
          tl.fromTo("#s2-k2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, at(10.7));
          tl.fromTo("#s2-k2 .rule", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.5 }, at(10.75));
          tl.fromTo(".s2-line", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "power4.out", stagger: 0.32 }, at(10.75));
          tl.to(["#s2-top", "#s2-statement"], { opacity: 0, y: -24, duration: 0.45, ease: "power3.in", stagger: 0.08 }, at(14.35));
          window.__timelines["s2-hq"] = tl;
        })();
      </script>
    </template>
  </body>
