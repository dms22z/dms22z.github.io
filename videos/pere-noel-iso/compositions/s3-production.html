<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #s3-read {
          left: 96px;
          top: 96px;
          padding: 30px 38px 32px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        #s3-read .ov-display {
          font-size: 64px;
          text-shadow: none;
        }
        #s3-counter-row {
          display: flex;
          align-items: baseline;
          gap: 18px;
          margin-top: 8px;
        }
        #s3-counter-label {
          font-size: 20px;
          color: #c9d3f2;
        }
        #s3-counter {
          font-family: "Archivo Black", sans-serif;
          font-size: 44px;
          color: #f3b23e;
        }
        #s3-wish {
          position: absolute;
          right: 110px;
          top: 150px;
          width: 560px;
          background: #fbf3e4;
          border-radius: 18px;
          overflow: hidden;
          box-shadow: 0 24px 70px rgba(3, 6, 22, 0.45);
          color: #1b1f3a;
        }
        #s3-wish-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 20px 28px;
          background: #c8283a;
          color: #fbf3e4;
          font-family: "Space Mono", monospace;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.16em;
        }
        #s3-wish ul {
          list-style: none;
          margin: 0;
          padding: 16px 28px 22px;
        }
        #s3-wish li {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 12px 0;
          border-bottom: 2px dashed rgba(27, 31, 58, 0.18);
          font-weight: 700;
          font-size: 32px;
        }
        #s3-wish li:last-child {
          border-bottom: none;
        }
        .s3-box {
          position: relative;
          flex: none;
          width: 38px;
          height: 38px;
          border: 4px solid #1b1f3a;
          border-radius: 8px;
        }
        .s3-check {
          position: absolute;
          left: 4px;
          top: -12px;
          width: 34px;
          height: 40px;
          overflow: visible;
        }
        .s3-check path {
          fill: none;
          stroke: #1f8a5a;
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #s3-chain {
          position: absolute;
          left: 96px;
          bottom: 88px;
          display: flex;
          align-items: center;
          gap: 24px;
          padding: 20px 32px;
          background: #f3b23e;
          border-radius: 14px;
          color: #0d1638;
          box-shadow: 0 24px 70px rgba(3, 6, 22, 0.4);
        }
        #s3-chain .big {
          font-family: "Archivo Black", sans-serif;
          font-size: 46px;
          text-transform: uppercase;
        }
        #s3-chain .small {
          font-family: "Space Mono", monospace;
          font-weight: 700;
          font-size: 24px;
          letter-spacing: 0.14em;
        }
      </style>
      <div id="root" class="ov" data-composition-id="s3-production" data-width="1920" data-height="1080" data-duration="9.3">
        <div class="ov-plate" id="s3-read">
          <div class="ov-kicker" id="s3-kicker"><span class="rule"></span><span>Centre de tri</span></div>
          <div class="ov-display"><span class="ov-mask"><span class="s3-line">Chaque lettre</span></span></div>
          <div class="ov-display ov-gold"><span class="ov-mask"><span class="s3-line">est lue.</span></span></div>
          <div id="s3-counter-row">
            <span class="ov-mono" id="s3-counter-label">Lettres traitées</span>
            <span class="ov-num" id="s3-counter">0</span>
          </div>
        </div>
        <div id="s3-wish">
          <div id="s3-wish-head"><span>SOUHAITS ENREGISTRÉS</span><span>✦ 2026</span></div>
          <ul>
            <li class="s3-item"><span class="s3-box"><svg class="s3-check" viewBox="0 0 34 40"><path d="M3 22 L13 33 L31 4" /></svg></span>Un vélo rouge</li>
            <li class="s3-item"><span class="s3-box"><svg class="s3-check" viewBox="0 0 34 40"><path d="M3 22 L13 33 L31 4" /></svg></span>Un train électrique</li>
            <li class="s3-item"><span class="s3-box"><svg class="s3-check" viewBox="0 0 34 40"><path d="M3 22 L13 33 L31 4" /></svg></span>Une poupée qui parle</li>
            <li class="s3-item"><span class="s3-box"><svg class="s3-check" viewBox="0 0 34 40"><path d="M3 22 L13 33 L31 4" /></svg></span>Un robot (bleu !)</li>
          </ul>
        </div>
        <div id="s3-chain">
          <span class="big">À la chaîne</span><span class="small">365 JOURS / 365 · 24 H / 24</span>
        </div>
      </div>
      <script>
        (function () {
          const S = 15.0;
          const at = (g) => g - S;
          const tl = gsap.timeline({ paused: true });
          const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
          tl.fromTo("#s3-read", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, at(15.3));
          tl.fromTo("#s3-kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5 }, at(15.4));
          tl.fromTo(".s3-line", { yPercent: 115 }, { yPercent: 0, duration: 0.65, ease: "power4.out", stagger: 0.28 }, at(15.45));
          const c = { v: 0 };
          const el = document.getElementById("s3-counter");
          tl.fromTo(c, { v: 1204000 }, { v: 2147483000, duration: 8.4, ease: "power2.in", onUpdate: () => (el.textContent = fmt(c.v)) }, at(15.6));
          // wish list
          tl.fromTo("#s3-wish", { opacity: 0, y: 40, rotation: 3 }, { opacity: 1, y: 0, rotation: -1.5, duration: 0.7, ease: "back.out(1.6)" }, at(16.95));
          tl.fromTo(".s3-item", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.1 }, at(17.05));
          gsap.utils.toArray(".s3-check path").forEach((p, i) => {
            tl.fromTo(p, { strokeDasharray: 60, strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, at(17.25 + i * 0.3));
          });
          tl.to("#s3-wish", { opacity: 0, x: 120, rotation: 4, duration: 0.5, ease: "power3.in" }, at(18.75));
          tl.to("#s3-read", { opacity: 0, x: -60, duration: 0.45, ease: "power3.in" }, at(18.85));
          // chain banner
          tl.fromTo("#s3-chain", { opacity: 0, y: 50, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, at(22.55));
          tl.to("#s3-chain", { opacity: 0, y: 30, duration: 0.4, ease: "power3.in" }, at(23.9));
          window.__timelines["s3-production"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
